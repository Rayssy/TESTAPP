<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Air Algérie Catering provides airline meal services, airport hospitality, and catering operations for Air Algérie flights." />
    <title>Air Algérie Catering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            color-scheme: light;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --brand-green: #0f6a44;
            --brand-red: #b61d1d;
            --brand-gold: #d9a72b;
            --cream: #f7efe3;
            --cream-strong: #fdf8f0;
            --ink: #153447;
            --muted: #5d6f79;
            --surface: rgba(255, 255, 255, 0.86);
            --surface-strong: #ffffff;
            --shadow: 0 20px 55px rgba(21, 52, 71, 0.12);
            color: var(--ink);
            background: var(--cream);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            position: relative;
            background:
                linear-gradient(135deg, rgba(247, 239, 227, 0.96) 0%, rgba(253, 248, 240, 0.96) 100%),
                url('logo.jpeg') repeat;
            background-size: auto, 120px 120px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.56) 0%, rgba(255, 255, 255, 0.16) 100%);
            pointer-events: none;
            z-index: 0;
        }

        #root {
            position: relative;
            z-index: 1;
        }

        #root {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 106, 68, 0.95) 0%, rgba(182, 29, 29, 0.95) 60%, rgba(217, 167, 43, 0.94) 100%);
            color: white;
            border-radius: 32px;
            padding: 54px 44px;
            display: grid;
            grid-template-columns: 1.25fr 0.85fr;
            gap: 32px;
            overflow: hidden;
            box-shadow: var(--shadow);
            align-items: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(15, 106, 68, 0.85) 0%, rgba(182, 29, 29, 0.72) 58%, rgba(217, 167, 43, 0.28) 100%),
                url('Nouveau logo catering .jpeg') center/cover no-repeat;
            opacity: 0.24;
            pointer-events: none;
            transform: scale(1.04);
        }

        .hero > * {
            position: relative;
            z-index: 1;
        }

        .hero__brand {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.78);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.14);
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo__mark {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo__label {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.97);
        }

        .hero__title {
            margin: 0;
            font-size: clamp(2.6rem, 4vw, 4.4rem);
            line-height: 0.96;
            letter-spacing: -0.03em;
            font-weight: 800;
        }

        .hero__subtitle {
            margin: 0;
            max-width: 760px;
            font-size: 1.06rem;
            line-height: 1.78;
            color: rgba(255, 255, 255, 0.94);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.14);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.18);
            color: #fff8e8;
            border-radius: 999px;
            padding: 0.72rem 1rem;
            font-weight: 600;
            width: fit-content;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
        }

        .section {
            margin-top: 36px;
            display: grid;
            gap: 20px;
        }

        .portfolio-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        .cards {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid rgba(15, 106, 68, 0.12);
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 24px 60px rgba(21, 52, 71, 0.16);
        }

        .card__title {
            margin: 0 0 12px;
            font-size: 1.16rem;
            font-weight: 700;
            color: var(--brand-green);
        }

        .card__text {
            margin: 0;
            line-height: 1.75;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .service-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 12px;
        }

        .service-list li {
            background: linear-gradient(90deg, var(--surface-strong) 0%, #f8efdc 100%);
            border: 1px solid rgba(182, 29, 29, 0.16);
            border-radius: 16px;
            padding: 16px 18px;
            font-weight: 500;
            color: var(--ink);
        }

        .highlight {
            color: var(--brand-red);
            font-weight: 700;
        }

        .footer {
            margin-top: 48px;
            padding: 24px 28px;
            border-radius: 24px;
            background: linear-gradient(90deg, rgba(255,255,255,0.95) 0%, rgba(247,239,227,0.95) 100%);
            border: 1px solid rgba(15, 106, 68, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
        }

        .footer p {
            margin: 0;
            color: var(--muted);
        }

        @media (min-width: 768px) {
            .hero {
                grid-template-columns: 1fr 1fr;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useMemo } = React;

        function ServiceCard({ title, description }) {
            return (
                <article className="card">
                    <h3 className="card__title">{title}</h3>
                    <p className="card__text">{description}</p>
                </article>
            );
        }

        function App() {
            const services = useMemo(() => [
                {
                    title: 'Inflight Catering',
                    description: 'Premium meal preparation and delivery for domestic and international flights, curated to match passenger preferences and dietary needs.'
                },
                {
                    title: 'Menu Design',
                    description: 'Seasonal menus, balanced nutrition, and culturally inspired dishes that reflect Air Algérie’s hospitality standards.'
                },
                {
                    title: 'Airport Hospitality',
                    description: 'Comfort-focused lounge support, airport meal handling, and logistics coordination for smooth boarding experiences.'
                },
                {
                    title: 'Food Safety & Logistics',
                    description: 'Strict quality control, certified food handling, and on-time delivery for every catering assignment.'
                }
            ], []);

            return (
                <main id="air-catering-app">
                    <section className="hero">
                        <div>
                            <div className="hero__brand">
                                <span className="logo__label">Air Algérie Catering</span>
                            </div>
                            <span className="badge">Trusted by Air Algérie</span>
                            <h1 className="hero__title">Air Algérie Catering</h1>
                            <p className="hero__subtitle">We deliver fresh, elegant inflight dining and airport hospitality that reflects the warmth of Algeria. Our catering experience keeps every flight on schedule while elevating the passenger journey.</p>
                        </div>
                        <div>
                            <div className="card" style={{ background: 'rgba(255,255,255,0.18)', border: '1px solid rgba(255,255,255,0.22)', color: '#fef8ef' }}>
                                <div className="hero__brand">
                                    <span className="logo">
                                        <img className="logo__mark" src="Nouveau logo catering .jpeg" alt="Company logo" />
                                    </span>
                                    <span className="logo__label">Portfolio</span>
                                </div>
                                <h3 className="card__title" style={{ color: '#fff8e8' }}>Our commitment</h3>
                                <p className="card__text" style={{ color: '#fdf4e3' }}>Reliability, quality and authentic service in every meal. From preparation to boarding, we make every moment feel seamless.</p>
                            </div>
                        </div>
                    </section>

                    <section className="section">
                        <div className="card">
                            <h2 className="card__title">What We Do</h2>
                            <p className="card__text">Air Algérie Catering prepares and supplies inflight meals, snacks, and beverages for Air Algérie flights. Our team plans menus, kitchens meals safely, and coordinates delivery to aircraft with care and precision.</p>
                        </div>
                    </section>

                    <section className="section portfolio-grid">
                        {services.map(service => (
                            <ServiceCard key={service.title} title={service.title} description={service.description} />
                        ))}
                    </section>

                    <section className="section card">
                        <h2 className="card__title">Why Air Algérie Catering?</h2>
                        <p className="card__text">We blend culinary craftsmanship with strict safety standards so passengers enjoy a memorable onboard experience. Our operations support Air Algérie’s commitment to quality service, consistency, and hospitality.</p>
                    </section>

                    <footer className="footer">
                        <p><strong className="highlight">Air Algérie Catering</strong> is dedicated to serving fresh, safe, and culturally inspired meals on every flight.</p>
                        <p>Built with React • Designed for modern aviation hospitality</p>
                    </footer>
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
